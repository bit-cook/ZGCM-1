# ZGCM-1 instruction-following GRPO recipe (mixed-RL experiments,
# Section 4.2 of the report).
#
# Required environment variables:
#   ZGCM_MODEL_PATH   path to the HF checkpoint of the policy (with tokenizer)
#   ZGCM_TRAIN_JSONL  training prompts, JSONL with the schema in RUNNING.md
#   ZGCM_VALID_JSONL  validation prompts, same schema
#   AREAL_ADMIN_API_KEY  any non-empty string for a local AReaL cluster
#
# The instruction-following reward needs Open-Instruct's IFEvalG registry;
# export ZGCM_OPEN_INSTRUCT_ROOT, ZGCM_OPEN_INSTRUCT_SITE_PACKAGES, and
# NLTK_DATA as documented in RUNNING.md before launch.
#
# Optional environment variables:
#   ZGCM_N_NODES (default 1), ZGCM_N_GPUS_PER_NODE (default 8)
#   ZGCM_EXPECTED_TRAIN_ROWS / ZGCM_EXPECTED_VALID_ROWS  exact row-count gates
#   ZGCM_RL_STATUS_ROOT (default ./status)  eval-marker / preflight output

experiment_name: zgcm1_if_grpo
trial_name: if_grpo
seed: 42
enable_offload: false
total_train_epochs: 3
total_train_steps: 219
tokenizer_path: ${actor.path}

cluster:
  n_nodes: ${oc.env:ZGCM_N_NODES,1}
  n_gpus_per_node: ${oc.env:ZGCM_N_GPUS_PER_NODE,8}
  fileroot: ./areal_runs
  name_resolve:
    type: nfs
    nfs_record_root: ./areal_runs/name_resolve

scheduler:
  type: ray
  startup_timeout: 300

rollout:
  backend: vllm
  admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_head_offpolicyness: 1
  enable_rollout_tracing: false
  scheduling_spec: null
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  setup_timeout: 3600
  request_timeout: 14400
  agent:
    mode: inline
    admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}
    export_style: individual
    turn_discount: 1.0

gconfig:
  n_samples: 8
  min_new_tokens: 0
  max_new_tokens: 65536
  max_tokens: 98304
  greedy: false
  temperature: 1.0
  top_p: 1.0
  top_k: 100000000
  ignore_eos: false
  skip_special_tokens: true
  frequency_penalty: 0.0

actor:
  backend: fsdp
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:ZGCM_MODEL_PATH}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  attn_impl: flash_attention_3
  dtype: bfloat16
  optimizer_dtype: float32
  fsdp:
    memory_efficient_load: false
  mb_spec:
    max_tokens_per_mb: 69632
    packing_algorithm: ffd
  optimizer:
    type: adam
    lr: 1.0e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.03
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  mask_no_eos_with_zero: false
  ppo_n_minibatches: 12
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: mask
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec: null

ref: null
critic: null
teacher: null

vllm:
  model: ${actor.path}
  model_impl: vllm
  seed: ${seed}
  skip_tokenizer_init: false
  enforce_eager: false
  dtype: ${actor.dtype}
  max_model_len: 98304
  gpu_memory_utilization: 0.88
  disable_sliding_window: false
  no_enable_prefix_caching: true

train_dataset:
  batch_size: 384
  shuffle: true
  pin_memory: false
  num_workers: 0
  drop_last: true
  scheduling_spec: null
  path: ${oc.env:ZGCM_TRAIN_JSONL}
  type: rl
  max_length: 4096

valid_dataset:
  batch_size: ${oc.env:ZGCM_VALID_BATCH,153}
  shuffle: false
  pin_memory: false
  num_workers: 0
  drop_last: false
  scheduling_spec: null
  path: ${oc.env:ZGCM_VALID_JSONL}
  type: rl
  max_length: 4096

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 10
  freq_secs: null

recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 10
  freq_secs: null
  eval_before_train: false

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  tensorboard:
    path: ./tensorboard

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  save_interval: 1
  session_tracer:
    enabled: false

eval_gconfig:
  n_samples: 8
  min_new_tokens: 0
  max_new_tokens: 65536
  max_tokens: 98304
  greedy: false
  temperature: 1.0
  top_p: 1.0
  top_k: 100000000
  ignore_eos: false
  skip_special_tokens: true
  frequency_penalty: 0.0
